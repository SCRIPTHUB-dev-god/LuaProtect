<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>luau-pro project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">L</span>
      <div>
        <h1>luau-pro project</h1>
        <p>Full Code - Copy ke Editor Kamu</p>
      </div>
    </div>
    <button class="hamburger" id="hamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="menu" id="menu" hidden>
    <a href="#editor">Editor</a>
    <a href="#output">Hasil</a>
    <a href="#tentang">Tentang</a>
  </nav>

  <main class="wrap" id="editor">
    <section class="panel">
      <label class="label" for="inputCode">Kode Luau</label>
      <textarea id="inputCode" rows="10" placeholder="Tempel kode Luau di sini..."></textarea>

      <div class="options">
        <label><input type="checkbox" id="optComments" checked /> Hapus komentar</label>
        <label><input type="checkbox" id="optRename" checked /> Rename locals</label>
        <label><input type="checkbox" id="optStrings" checked /> Encode strings</label>
        <label><input type="checkbox" id="optMinify" checked /> Minify</label>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnProtect" type="button">Protect</button>
        <button class="btn" id="btnCopy" type="button">Copy</button>
        <button class="btn danger" id="btnClear" type="button">Clear</button>
      </div>

      <label class="label" for="outputCode">Hasil Protect</label>
      <textarea id="outputCode" rows="10" readonly placeholder="Hasil protect akan muncul di sini..."></textarea>
      <p class="hint" id="status">Siap. Tempel kode, lalu tekan Protect.</p>
    </section>

    <section class="panel" id="tentang">
      <h2>Cara pakai</h2>
      <ol>
        <li>Copy 3 file di bawah ke satu folder.</li>
        <li>Buka index.html di browser.</li>
        <li>Tempel kode Luau, pilih opsi, tekan Protect.</li>
      </ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
