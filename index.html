<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Protect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-slate-200 flex flex-col justify-between min-h-screen p-4 md:p-8">
    <header class="w-full max-w-6xl mx-auto mb-8 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-xl">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-wide text-white">LUA<span class="gradient-text">PROTECT</span></h1>
                <p class="text-xs text-slate-400 mt-1">free Lua Protect lifetime</p>
            </div>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
            <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
            Vercel Engine
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 my-auto">
        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="glass-card rounded-2xl p-6 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-code text-indigo-400"></i>
                        <span class="font-semibold text-sm text-white">Input</span>
                    </div>
                    <span class="text-xs text-slate-500" id="charCount">0 chars</span>
                </div>
                <textarea id="luaInput" placeholder="Enter your Lua script in here" class="w-full h-80 bg-slate-950/80 border border-slate-800 rounded-xl p-4 text-xs font-mono text-indigo-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                
                <div class="flex items-center gap-3 mt-4">
                    <button onclick="generateLink()" class="flex-1 py-3 px-5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        Generate Protect
                    </button>
                    <button onclick="clearAll()" class="py-3 px-5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-slate-300 font-semibold text-xs transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can text-red-400"></i>
                        Clear
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 flex flex-col gap-4">
            <div class="glass-card rounded-2xl p-6 flex flex-col h-full justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-terminal text-purple-400"></i>
                            <span class="font-semibold text-sm text-white">Output Protect</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Protected</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-4 min-h-[220px] flex flex-col justify-between mb-4">
                        <div id="outputText" class="text-xs font-mono text-slate-400 break-all select-all">Generated loadstring will appear here...</div>
                    </div>
                </div>

                <button onclick="copyOutput()" class="w-full py-3.5 px-5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 font-semibold text-xs transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-copy" id="copyIcon"></i>
                    <span id="copyText">Copy</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mx-auto mt-8 text-center text-xs text-slate-600">
        Lua Protect &copy; 2026 Vercel Deployment
    </footer>

    <script>
        const luaInput = document.getElementById('luaInput');
        const charCount = document.getElementById('charCount');
        const outputText = document.getElementById('outputText');
        let generatedResult = "";

        luaInput.addEventListener('input', () => {
            charCount.innerText = `${luaInput.value.length} chars`;
        });

        function generateLink() {
            const code = luaInput.value.trim();
            if (!code) {
                alert("Please enter a Lua script first!");
                return;
            }
            const encoded = btoa(encodeURIComponent(code));
            const baseUrl = window.location.origin;
            generatedResult = `loadstring(game:HttpGet("${baseUrl}/api/raw?data=${encoded}"))()`;
            outputText.innerText = generatedResult;
            outputText.classList.remove('text-slate-400');
            outputText.classList.add('text-indigo-300');
        }

        function clearAll() {
            luaInput.value = "";
            outputText.innerText = "Generated loadstring will appear here...";
            outputText.classList.remove('text-indigo-300');
            outputText.classList.add('text-slate-400');
            charCount.innerText = "0 chars";
            generatedResult = "";
        }

        function copyOutput() {
            if (!generatedResult) {
                alert("Nothing to copy yet!");
                return;
            }
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(generatedResult)
                    .then(() => showCopySuccess())
                    .catch(() => fallbackCopy());
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const temp = document.createElement('textarea');
            temp.value = generatedResult;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                alert("Failed to copy automatically.");
            }
            document.body.removeChild(temp);
        }

        function showCopySuccess() {
            const copyText = document.getElementById('copyText');
            const copyIcon = document.getElementById('copyIcon');
            copyText.innerText = "Copied!";
            copyIcon.className = "fa-solid fa-check text-emerald-400";
            setTimeout(() => {
                copyText.innerText = "Copy Output";
                copyIcon.className = "fa-solid fa-copy";
            }, 2000);
        }
    </script>
</body>
</html>
