<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaProtect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cf-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #475569;
            border-radius: 4px;
            background: #0f172a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .cf-checkbox:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="text-slate-200 flex flex-col justify-between min-h-screen p-4 md:p-8">
    <header class="w-full max-w-6xl mx-auto mb-8 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-xl">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-wide text-white">LUA<span class="gradient-text">PROTECT</span></h1>
                <p class="text-xs text-slate-400 mt-1">Dashboard</p>
            </div>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
            <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
            100% free
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto my-auto flex flex-col items-center">
        <div id="cfContainer" class="w-full max-w-md bg-[#222222] border border-[#333333] rounded-lg p-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div id="cfBox" onclick="startCfVerify()" class="cf-checkbox">
                        <i id="cfCheckIcon" class="fa-solid fa-check text-white text-sm hidden"></i>
                        <i id="cfSpinner" class="fa-solid fa-circle-notch fa-spin text-indigo-400 text-sm hidden"></i>
                    </div>
                    <span id="cfLabel" class="text-sm font-normal text-slate-200">Verify you are human</span>
                </div>
                <div class="flex flex-col items-end pl-4 border-l border-[#333333]">
                    <div class="flex items-center gap-1">
                        <i class="fa-brands fa-cloudflare text-amber-500 text-xl"></i>
                        <span class="text-[11px] font-semibold text-slate-300">CLOUDFLARE</span>
                    </div>
                    <div class="flex gap-1 text-[9px] text-slate-500">
                        <a href="#" class="hover:underline">Privacy</a>
                        <span>•</span>
                        <a href="#" class="hover:underline">Terms</a>
                    </div>
                </div>
            </div>
        </div>

        <div id="dashboardContent" class="hidden w-full max-w-lg">
            <div class="glass-card rounded-2xl p-6 flex flex-col justify-between border-indigo-500/30 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl pointer-events-none"></div>
                <div>
                    <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-xl mb-4">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2 class="font-bold text-xl text-white tracking-wide mb-2">Lua Protect vault</h2>
                    <p class="text-xs text-slate-400 mb-6 leading-relaxed">Protect and convert your Lua scripts with high security</p>
                </div>
                <a href="lua-protect.html" class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Open Lua Protect Vault
                </a>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mx-auto mt-8 text-center text-xs text-slate-600">
        Lua Protect &copy; 2026 Vercel Deployment
    </footer>

    <script>
        function startCfVerify() {
            const box = document.getElementById('cfBox');
            const label = document.getElementById('cfLabel');
            const checkIcon = document.getElementById('cfCheckIcon');
            const spinner = document.getElementById('cfSpinner');
            const cfContainer = document.getElementById('cfContainer');
            const dashboardContent = document.getElementById('dashboardContent');

            box.onclick = null;
            box.style.borderColor = '#6366f1';
            spinner.classList.remove('hidden');
            label.innerText = 'Verifying...';

            setTimeout(() => {
                spinner.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                box.style.background = '#10b981';
                box.style.borderColor = '#10b981';
                label.innerText = 'Success!';

                setTimeout(() => {
                    cfContainer.classList.add('hidden');
                    dashboardContent.classList.remove('hidden');
                }, 800);
            }, 1500);
        }
    </script>
</body>
</html>
